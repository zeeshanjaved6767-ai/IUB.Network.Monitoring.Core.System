<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B3280"/>
      <stop offset="100%" stop-color="#13235A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Arched Dome Silhouette -->
  <path d="M 50 390 
           L 50 490 
           L 450 490 
           L 450 390 
           L 380 390 
           L 380 190 
           C 380 80, 250 15, 250 15 
           C 250 15, 120 80, 120 190 
           L 120 390 
           Z" 
        fill="url(#blueGrad)" 
        stroke="#0F172A" 
        stroke-width="3"
        filter="url(#subtleShadow)"/>

  <!-- Inner Gold Arch Border -->
  <path d="M 135 385 
           L 135 195 
           C 135 100, 250 35, 250 35 
           C 250 35, 365 100, 365 195 
           L 365 385 
           Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="7" 
        stroke-linejoin="round"/>

  <!-- Thin inner guide line -->
  <path d="M 145 385 
           L 145 200 
           C 145 110, 250 48, 250 48 
           C 250 48, 355 110, 355 200 
           L 355 385 
           Z" 
        fill="none" 
        stroke="#FCD34D" 
        stroke-width="1.5" 
        opacity="0.7"/>

  <!-- Minaret on Left-Center -->
  <!-- Minaret Spire & Crescent -->
  <path d="M 200 68 L 200 135 L 207 135 L 207 68 Z" fill="url(#goldGrad)"/>
  <circle cx="203.5" cy="62" r="5" fill="#FCD34D"/>
  <path d="M 200 55 C 205 52, 208 45, 203 40 C 200 48, 194 48, 200 55 Z" fill="#FCD34D"/>
  
  <!-- Minaret Spire Cone -->
  <polygon points="194,145 203.5,70 213,145" fill="url(#goldGrad)"/>

  <!-- Minaret Top Balcony -->
  <rect x="190" y="145" width="27" height="8" rx="2" fill="url(#goldGrad)"/>
  <rect x="193" y="153" width="21" height="28" fill="url(#goldGrad)"/>
  <!-- Windows in top chamber -->
  <rect x="196" y="158" width="5" height="12" rx="2" fill="#1B3280"/>
  <rect x="206" y="158" width="5" height="12" rx="2" fill="#1B3280"/>
  
  <!-- Minaret Second Balcony -->
  <rect x="187" y="181" width="33" height="8" rx="2" fill="url(#goldGrad)"/>
  <rect x="190" y="189" width="27" height="60" fill="url(#goldGrad)"/>
  <rect x="196" y="200" width="15" height="25" rx="3" fill="#1B3280"/>
  
  <!-- Minaret Third Balcony -->
  <rect x="184" y="249" width="39" height="10" rx="2" fill="url(#goldGrad)"/>
  <rect x="188" y="259" width="31" height="90" fill="url(#goldGrad)"/>
  <rect x="195" y="280" width="17" height="40" rx="3" fill="#1B3280"/>

  <!-- Main Mosque Dome Silhouette in Gold -->
  <path d="M 219 350 
           C 219 250, 310 230, 345 350 
           Z" 
        fill="url(#goldGrad)"/>
  <!-- Dome Finial/Spire -->
  <polygon points="280,240 283,215 286,240" fill="url(#goldGrad)"/>
  <circle cx="283" cy="212" r="3.5" fill="#FCD34D"/>

  <!-- Crescent Moon and Star in Upper Sky (Right side of minaret) -->
  <!-- Crescent -->
  <path d="M 285 85 
           A 32 32 0 1 0 325 155 
           A 38 38 0 1 1 285 85 Z" 
        fill="url(#goldGrad)"/>
  <!-- Star -->
  <polygon points="325,115 329,126 341,126 331,133 335,144 325,137 315,144 319,133 309,126 321,126" 
           fill="url(#goldGrad)"/>

  <!-- Stylized Calligraphy Inside the Dome / Minaret area: "وَيُزَكِّيهِمْ" -->
  <g fill="url(#goldGrad)" transform="matrix(0.85 0 0 0.85 220 270)">
    <path d="M 25 35 C 35 20, 50 15, 65 30 C 55 45, 40 40, 25 35 Z" fill="#1B3280"/>
    <circle cx="35" cy="20" r="4" fill="#1B3280"/>
    <circle cx="50" cy="18" r="4" fill="#1B3280"/>
    <path d="M 70 30 C 85 10, 105 25, 95 45 C 80 55, 65 40, 70 30 Z" fill="#1B3280"/>
    <circle cx="85" cy="15" r="4" fill="#1B3280"/>
  </g>

  <!-- Lower Base Ribbon / Bar for University Name -->
  <rect x="50" y="390" width="400" height="98" fill="#13235A"/>
  <line x1="50" y1="390" x2="450" y2="390" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Urdu / Arabic Calligraphy: اسلامیہ یونیورسٹی بہاولپور -->
  <g fill="url(#goldGrad)">
    <text x="250" y="458" 
          font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Arabic Typesetting', serif" 
          font-size="44" 
          font-weight="bold" 
          text-anchor="middle" 
          letter-spacing="2">
      اسلامیہ یونیورسٹی بہاولپور
    </text>
  </g>
</svg>
