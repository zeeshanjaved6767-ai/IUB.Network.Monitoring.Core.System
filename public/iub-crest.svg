<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- True IUB Royal Blue Gradient -->
    <linearGradient id="iubBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A3482"/>
      <stop offset="100%" stop-color="#12245C"/>
    </linearGradient>

    <!-- Rich IUB Gold Gradient -->
    <linearGradient id="iubGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="40%" stop-color="#EAA31B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Subtle Depth Shadow -->
    <filter id="crestShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Traditional Stepped Islamic Arch Silhouette -->
  <!-- Base steps out left to x=20 and right to x=480, height from 395 to 490 -->
  <path d="M 20 490
           L 20 395
           L 82 395
           L 82 205
           C 82 95, 250 18, 250 18
           C 250 18, 418 95, 418 205
           L 418 395
           L 480 395
           L 480 490
           Z"
        fill="url(#iubBlue)"
        filter="url(#crestShadow)"/>

  <!-- Outer Arch Accent Outline -->
  <path d="M 20 490
           L 20 395
           L 82 395
           L 82 205
           C 82 95, 250 18, 250 18
           C 250 18, 418 95, 418 205
           L 418 395
           L 480 395
           L 480 490
           Z"
        fill="none"
        stroke="#101F4E"
        stroke-width="2.5"/>

  <!-- Inner Gold Arch Portal Border -->
  <path d="M 100 395
           L 100 208
           C 100 112, 250 42, 250 42
           C 250 42, 400 112, 400 208
           L 400 395
           Z"
        fill="none"
        stroke="url(#iubGold)"
        stroke-width="8"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Thin Inner Accent Line inside Gold Border -->
  <path d="M 110 395
           L 110 212
           C 110 122, 250 56, 250 56
           C 250 122, 390 212, 390 395"
        fill="none"
        stroke="#FEF08A"
        stroke-width="1.5"
        opacity="0.6"/>

  <!-- ================= MINARET (LEFT SIDE) ================= -->
  <!-- Minaret Foundation & Base -->
  <g id="minaret">
    <!-- Base Plinth -->
    <rect x="175" y="372" width="42" height="23" rx="1" fill="url(#iubGold)"/>
    <rect x="178" y="356" width="36" height="16" fill="url(#iubGold)"/>
    <line x1="172" y1="372" x2="220" y2="372" stroke="#B45309" stroke-width="2"/>

    <!-- Lower Shaft -->
    <rect x="180" y="278" width="32" height="78" fill="url(#iubGold)"/>
    <!-- Shaft Window Openings (Navy cutout effect) -->
    <rect x="192" y="295" width="8" height="22" rx="4" fill="#152B6C"/>
    <rect x="192" y="330" width="8" height="15" rx="3" fill="#152B6C"/>

    <!-- Lower Balcony (Muezzin Gallery) with Ornate Brackets -->
    <path d="M 172 278 L 220 278 L 216 268 L 176 268 Z" fill="url(#iubGold)"/>
    <rect x="170" y="263" width="52" height="6" rx="1.5" fill="url(#iubGold)"/>
    <!-- Balustrade details -->
    <line x1="176" y1="264" x2="216" y2="264" stroke="#B45309" stroke-width="1.5"/>

    <!-- Middle Shaft -->
    <rect x="184" y="200" width="24" height="63" fill="url(#iubGold)"/>
    <!-- Middle window -->
    <rect x="193" y="215" width="6" height="18" rx="3" fill="#152B6C"/>

    <!-- Upper Balcony -->
    <path d="M 178 200 L 214 200 L 211 192 L 181 192 Z" fill="url(#iubGold)"/>
    <rect x="175" y="188" width="38" height="5" rx="1" fill="url(#iubGold)"/>

    <!-- Upper Lantern / Cupola (Arched Pavilion) -->
    <rect x="186" y="152" width="20" height="36" fill="url(#iubGold)"/>
    <!-- Arched open pavilion cutout in navy -->
    <path d="M 191 184 L 191 166 C 191 161, 201 161, 201 166 L 201 184 Z" fill="#152B6C"/>

    <!-- Cornice & Spire Base -->
    <rect x="183" y="148" width="26" height="4" rx="1" fill="url(#iubGold)"/>
    <polygon points="187,148 196,128 205,148" fill="url(#iubGold)"/>

    <!-- Slender Conical Spire -->
    <polygon points="192,130 196,68 200,130" fill="url(#iubGold)"/>
    
    <!-- Spire Rings & Finial -->
    <circle cx="196" cy="64" r="3.5" fill="#FEF08A"/>
    <path d="M 196 60 L 196 52" stroke="url(#iubGold)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="196" cy="50" r="2" fill="#FEF08A"/>
    <!-- Tiny Crescent Finial at tip -->
    <path d="M 194 48 A 3 3 0 1 1 198 48 A 3.8 3.8 0 1 0 194 48 Z" fill="url(#iubGold)"/>
  </g>

  <!-- ================= DOME SILHOUETTE (RIGHT-CENTER) ================= -->
  <g id="dome">
    <!-- Main Mosque Dome Body in Gold -->
    <!-- Rises from base line y=395 up to peak at (285, 235) -->
    <path d="M 215 395 
             L 215 365 
             C 215 285, 260 235, 285 235
             C 310 235, 355 285, 355 365
             L 355 395
             Z"
          fill="url(#iubGold)"/>

    <!-- Dome Finial Spire -->
    <path d="M 285 235 L 285 208" stroke="url(#iubGold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="285" cy="206" r="3.5" fill="#FEF08A"/>
    <path d="M 283 204 A 3 3 0 1 1 287 204 A 3.8 3.8 0 1 0 283 204 Z" fill="url(#iubGold)"/>

    <!-- Authentic Sacred Calligraphy "فَذَكِّرْ" on Dome Facade (Cutout in Navy) -->
    <g fill="#152B6C" stroke="#152B6C" stroke-linejoin="round">
      <!-- Calligraphic Letter Fa (ف) with loop and head -->
      <path d="M 235 348 
               C 232 344, 231 336, 237 332 
               C 243 328, 250 332, 248 338 
               C 246 345, 239 346, 235 348 Z" 
            stroke-width="1.5"/>
      <circle cx="240" cy="324" r="3" fill="#152B6C"/> <!-- Nuqta (dot) of Fa -->

      <!-- Letter Dhal (ذ) with tooth, body and dot -->
      <path d="M 252 346 
               C 256 338, 260 326, 266 322 
               C 270 320, 274 322, 273 328 
               C 271 335, 264 345, 258 348 Z" 
            stroke-width="2"/>
      <circle cx="268" cy="314" r="3" fill="#152B6C"/> <!-- Nuqta (dot) of Dhal -->

      <!-- Letter Kaf (ك) curving up and across -->
      <path d="M 276 348 
               C 282 344, 290 338, 296 324 
               C 302 310, 308 290, 316 280
               C 320 275, 326 278, 324 284
               C 318 298, 310 326, 300 342 
               C 292 350, 282 350, 276 348 Z" 
            stroke-width="2.5"/>
      <!-- S-stroke / Mark inside Kaf -->
      <path d="M 298 300 C 304 296, 308 302, 305 306 C 302 310, 296 312, 298 316" 
            fill="none" stroke="#152B6C" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Letter Ra (ر) swooping down -->
      <path d="M 302 344 
               C 310 346, 324 348, 336 344
               C 342 342, 345 346, 342 350
               C 334 358, 314 358, 302 352 Z" 
            stroke-width="2"/>

      <!-- Shaddah & Tashkeel Accents -->
      <!-- Shaddah over Kaf -->
      <path d="M 314 270 C 316 266, 318 270, 320 268 C 322 266, 324 270, 326 268" 
            fill="none" stroke="#152B6C" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Sukoon over Ra -->
      <circle cx="332" cy="336" r="3" fill="none" stroke="#152B6C" stroke-width="2"/>
    </g>
  </g>

  <!-- ================= CRESCENT & STAR IN THE NIGHT SKY ================= -->
  <g id="crescent-star">
    <!-- Golden Crescent Moon (Hilal) -->
    <path d="M 288 88 
             A 35 35 0 1 0 334 165 
             A 42 42 0 1 1 288 88 Z" 
          fill="url(#iubGold)"
          filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>

    <!-- Five-Pointed Star (Sitara) inside crescent's embrace -->
    <polygon points="334,124 338,135 350,135 340,142 344,153 334,146 324,153 328,142 318,135 330,135" 
             fill="url(#iubGold)"/>
    <circle cx="334" cy="139" r="2" fill="#FEF08A"/>
  </g>

  <!-- ================= BOTTOM BASE RECTANGLE & URDU CALLIGRAPHY ================= -->
  <!-- Horizontal Base Divider Line -->
  <line x1="20" y1="395" x2="480" y2="395" stroke="url(#iubGold)" stroke-width="4.5"/>
  <line x1="82" y1="395" x2="418" y2="395" stroke="#FEF08A" stroke-width="1.5"/>

  <!-- Urdu Calligraphy: اسلامیہ یونیورسٹی بہاولپور -->
  <!-- Rendered with high precision in Golden Calligraphic Glyphs -->
  <g fill="url(#iubGold)">
    <text x="250" y="462" 
          font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Urdu Typesetting', 'Amiri', serif" 
          font-size="44" 
          font-weight="bold" 
          text-anchor="middle"
          letter-spacing="1">
      اسلامیہ یونیورسٹی بہاولپور
    </text>
  </g>
</svg>
