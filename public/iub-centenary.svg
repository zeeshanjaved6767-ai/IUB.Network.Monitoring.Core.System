<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Scalloped Gold-Amber Rosette Gradient -->
    <linearGradient id="centenaryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Deep Navy Circular Ring Gradient -->
    <linearGradient id="centenaryNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E327A"/>
      <stop offset="100%" stop-color="#132050"/>
    </linearGradient>

    <!-- Vibrant Centenary Cyan/Sky Blue for 100 -->
    <linearGradient id="centenaryCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#0080C0"/>
    </linearGradient>

    <!-- Rosette Drop Shadow -->
    <filter id="centenaryShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <!-- Circular Text Paths -->
    <!-- Top Arc for "The Islamia University of Bahawalpur" -->
    <path id="topArcPath" d="M 68 250 A 182 182 0 1 1 432 250"/>
    <!-- Bottom Arc for "Jamia Abbasia" -->
    <path id="bottomArcPath" d="M 425 250 A 175 175 0 0 1 75 250"/>
  </defs>

  <!-- ================= 16-LOBE SCALLOPED ROSETTE (OUTER BADGE) ================= -->
  <path d="M 250 15
           C 275 15, 290 32, 312 28
           C 334 24, 345 44, 368 46
           C 391 48, 396 70, 417 78
           C 438 86, 436 109, 453 122
           C 470 135, 461 159, 473 176
           C 485 193, 471 216, 478 236
           C 485 256, 467 277, 469 298
           C 471 319, 450 336, 447 357
           C 444 378, 421 390, 413 410
           C 405 430, 381 437, 368 454
           C 355 471, 331 471, 314 483
           C 297 495, 274 487, 254 494
           C 234 501, 214 489, 194 490
           C 174 491, 157 475, 138 470
           C 119 465, 107 446, 91 436
           C 75 426, 68 404, 56 390
           C 44 376, 43 353, 35 336
           C 27 319, 32 296, 29 277
           C 26 258, 37 238, 39 218
           C 41 198, 33 176, 40 157
           C 47 138, 62 122, 74 106
           C 86 90, 89 67, 106 56
           C 123 45, 143 51, 163 45
           C 183 39, 199 21, 221 21
           Z"
        fill="url(#centenaryGold)"
        filter="url(#centenaryShadow)"/>

  <!-- ================= NAVY BLUE CIRCULAR RING ================= -->
  <circle cx="250" cy="250" r="218" fill="url(#centenaryNavy)"/>
  <circle cx="250" cy="250" r="216" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="250" cy="250" r="148" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Top Curved Text: The Islamia University of Bahawalpur -->
  <text fill="#FFFFFF" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="26" 
        font-weight="800" 
        letter-spacing="2.2">
    <textPath href="#topArcPath" startOffset="50%" text-anchor="middle">
      The Islamia University of Bahawalpur
    </textPath>
  </text>

  <!-- Flanking Stars (Left & Right) -->
  <!-- Left Star at ~9 o'clock -->
  <polygon points="76,245 79,235 89,235 81,241 84,251 76,245 68,251 71,241 63,235 73,235" 
           fill="#F59E0B" stroke="#D97706" stroke-width="0.5"/>
  <!-- Right Star at ~3 o'clock -->
  <polygon points="424,245 427,235 437,235 429,241 432,251 424,245 416,251 419,241 411,235 421,235" 
           fill="#F59E0B" stroke="#D97706" stroke-width="0.5"/>

  <!-- Bottom Curved Text: Jamia Abbasia -->
  <text fill="#FFFFFF" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="3.8">
    <textPath href="#bottomArcPath" startOffset="50%" text-anchor="middle">
      Jamia Abbasia
    </textPath>
  </text>

  <!-- ================= CENTRAL WHITE DISK ================= -->
  <circle cx="250" cy="250" r="146" fill="#FFFFFF"/>

  <!-- ================= INNER ARABIC CALLIGRAPHY: فَذَكِّرْ & CONSTELLATION STARS ================= -->
  <!-- Constellation Stars Arching Above Calligraphy -->
  <g fill="#152B6C">
    <!-- Left constellation cluster -->
    <polygon points="172,142 174,138 178,138 175,140 176,144 172,142 168,144 169,140 166,138 170,138"/>
    <polygon points="190,132 192,128 196,128 193,130 194,134 190,132 186,134 187,130 184,128 188,128"/>
    <polygon points="210,125 212,121 216,121 213,123 214,127 210,125 206,127 207,123 204,121 208,121"/>
    
    <!-- Right constellation cluster -->
    <polygon points="290,125 292,121 296,121 293,123 294,127 290,125 286,127 287,123 284,121 288,121"/>
    <polygon points="310,132 312,128 316,128 313,130 314,134 310,132 306,134 307,130 304,128 308,128"/>
    <polygon points="328,142 330,138 334,138 331,140 332,144 328,142 324,144 325,140 322,138 326,138"/>

    <!-- Sacred Calligraphy: فَذَكِّرْ -->
    <g transform="translate(195, 130) scale(1.1)">
      <!-- Letter Fa (ف) with loop -->
      <path d="M 12 40 C 9 36, 8 28, 14 24 C 20 20, 27 24, 25 30 C 23 37, 16 38, 12 40 Z"/>
      <circle cx="17" cy="18" r="2.8" fill="#152B6C"/>

      <!-- Letter Dhal (ذ) -->
      <path d="M 28 38 C 32 30, 36 18, 42 14 C 46 12, 50 14, 49 20 C 47 27, 40 37, 34 40 Z"/>
      <circle cx="44" cy="8" r="2.8" fill="#152B6C"/>

      <!-- Letter Kaf (ك) -->
      <path d="M 52 40 C 58 36, 66 30, 72 16 C 78 2, 84 -18, 92 -28 C 96 -33, 102 -30, 100 -24 C 94 -10, 86 18, 76 34 C 68 42, 58 42, 52 40 Z"/>
      <path d="M 74 -10 C 80 -14, 84 -8, 81 -4 C 78 0, 72 2, 74 6" fill="none" stroke="#152B6C" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Letter Ra (ر) -->
      <path d="M 78 36 C 86 38, 100 40, 112 36 C 118 34, 121 38, 118 42 C 110 50, 90 50, 78 44 Z"/>

      <!-- Shaddah & Sukoon -->
      <path d="M 90 -38 C 92 -42, 94 -38, 96 -40 C 98 -42, 100 -38, 102 -40" fill="none" stroke="#152B6C" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="108" cy="28" r="2.8" fill="none" stroke="#152B6C" stroke-width="1.8"/>
    </g>
  </g>

  <!-- ================= BOLD CYAN CENTENARY "100" ================= -->
  <g fill="url(#centenaryCyan)">
    <!-- Number 1 -->
    <rect x="142" y="202" width="28" height="88" rx="3"/>
    <polygon points="142,228 122,224 122,208 142,202"/>
    <rect x="122" y="282" width="68" height="12" rx="2"/>

    <!-- First 0 -->
    <path d="M 232 202
             C 214 202, 202 216, 202 248
             C 202 280, 214 294, 232 294
             C 250 294, 262 280, 262 248
             C 262 216, 250 202, 232 202 Z
             M 232 222
             C 238 222, 242 230, 242 248
             C 242 266, 238 274, 232 274
             C 226 274, 222 266, 222 248
             C 222 230, 226 222, 232 222 Z"
          fill-rule="evenodd"/>

    <!-- Second 0 -->
    <path d="M 314 202
             C 296 202, 284 216, 284 248
             C 284 280, 296 294, 314 294
             C 332 294, 344 280, 344 248
             C 344 216, 332 202, 314 202 Z
             M 314 222
             C 320 222, 324 230, 324 248
             C 324 266, 320 274, 314 274
             C 308 274, 304 266, 304 248
             C 304 230, 308 222, 314 222 Z"
          fill-rule="evenodd"/>
  </g>

  <!-- ================= GOLDEN RIBBON PLAQUE: YEARS OF ACADEMIC EXCELLENCE ================= -->
  <g>
    <rect x="138" y="306" width="224" height="26" rx="2" fill="#F59E0B" stroke="#D97706" stroke-width="1.2"/>
    <text x="250" y="324" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12.5" 
          font-weight="900" 
          fill="#132050" 
          text-anchor="middle" 
          letter-spacing="0.6">
      YEARS OF ACADEMIC EXCELLENCE
    </text>
  </g>

  <!-- ================= 1925 - 2025 ================= -->
  <text x="250" y="354" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="24" 
        font-weight="800" 
        fill="#132050" 
        text-anchor="middle" 
        letter-spacing="1">
    1925-2025
  </text>
</svg>
